<!-- templates/escola/base.html -->

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'portfolio/styles.css' %}">
    <style>
        .errorlist {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <a href="{% url 'landingpage' %}" style="text-decoration: none; color: inherit;">
                Portfolio
            </a>
        </h1>
        <nav>
            <a href="{% url 'licenciaturas' %}">Licenciaturas</a> 
            <a href="{% url 'projetos' %}">Projetos</a> 
            <a href="{% url 'tecnologias' %}">Tecnologias</a> 
            <a href="{% url 'competencias' %}">Competências</a> 
            <a href="{% url 'formacoes' %}">Formações</a> 
            <a href="{% url 'makingof' %}">MakingOf</a> 
            <a href="{% url 'tfcs' %}">TfC's</a> 
            <a href="{% url 'artigos' %}">Artigos</a> 
            
            
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}

        </nav>
    </header>


    <main>
        {% block content %}
        <!-- Conteúdo dinâmico -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026</p>
    </footer>

</body>
</html>
